<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 YEONGJONG GOT TALENT</title>

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e1b4b'/><text x='50%' y='68%' font-size='60' text-anchor='middle'>🏆</text></svg>">
    <meta name="apple-mobile-web-app-title" content="영종 갓탤런트">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; padding-bottom: 40px; }
        header { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: white; padding: 20px; text-align: center; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; color: #f8fafc; }
        .header-sub { font-size: 0.75rem; color: #c7d2fe; }
        .btn-admin { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 10px; border-radius: 14px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        .card { background: #ffffff; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .title { font-size: 1rem; font-weight: bold; margin-bottom: 12px; color: #1e293b; display: flex; justify-content: space-between; align-items: center; }
        
        .judge-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .j-btn { background: #f8fafc; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: #475569; white-space: nowrap; cursor: pointer; }
        .j-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        
        .team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media(min-width: 500px) { .team-grid { grid-template-columns: repeat(5, 1fr); } }
        .t-card { background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 10px; cursor: pointer; text-align: left; }
        .t-card.active { background: #fff7ed; border-color: #f97316; }
        .t-num { font-size: 0.7rem; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 4px; }
        .t-card.active .t-num { background: #f97316; color: white; }
        .t-name { font-size: 0.85rem; font-weight: bold; color: #0f172a; }
        .t-prev { font-size: 0.7rem; color: #2563eb; margin-top: 4px; font-weight: bold; }

        .banner { background: #0f172a; color: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .s-group { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .s-head { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; }
        .s-val { color: #2563eb; font-size: 1rem; }
        .s-ctrl { display: flex; align-items: center; gap: 10px; }
        .btn-pm { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        input[type="range"] { flex: 1; height: 6px; accent-color: #2563eb; }

        .btn-main { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-sub-reset { width: 100%; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; margin-top: 6px; }
        .btn-csv { background: #10b981; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-total-reset { background: #ef4444; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 6px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; margin-top: 8px; }
        th, td { padding: 8px 4px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; color: #475569; }
        .rank-1 { background-color: #fef3c7 !important; font-weight: bold; }
        .rank-2 { background-color: #f1f5f9 !important; font-weight: bold; }
        .rank-3 { background-color: #ffedd5 !important; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
        .modal-body { background: white; border-radius: 14px; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; padding: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>2026 ACADEMIC YEAR 🌟 YEONGJONG GOT TALENT (IN PYEONGCHANG)</h1>
        <div class="header-sub">Smart Judging System</div>
        <button class="btn-admin" onclick="openAdmin()">🔐 관리자</button>
    </header>

    <div class="container">
        <!-- STEP 1 -->
        <div class="card">
            <div class="title">
                <span>👤 STEP 1. 심사위원 선택</span>
                <button class="j-btn" style="padding:4px 10px; font-size:0.75rem;" onclick="addJudge()">+ 위원 추가</button>
            </div>
            <div class="judge-scroll" id="judgeGrid"></div>
        </div>

        <!-- STEP 2 -->
        <div class="card">
            <div class="title"><span>🎭 STEP 2. 팀 선택 (10개 팀)</span></div>
            <div class="team-grid" id="teamGrid"></div>
        </div>

        <!-- STEP 3 -->
        <div class="card">
            <div class="banner">
                <div>
                    <span class="t-num" id="bNum" style="background:#f59e0b; color:#0f172a;">1번 팀</span>
                    <div style="font-size: 1rem; font-weight: bold;" id="bTitle">[1반] 댄스</div>
                    <div style="font-size: 0.75rem; color:#94a3b8;" id="bDesc">로딩중...</div>
                </div>
                <div style="background:#334155; padding:4px 8px; border-radius:6px; font-size:0.75rem;" id="bGenre">댄스</div>
            </div>

            <div class="s-group">
                <div class="s-head"><span>⭐ 완성도 및 준비도 (40점)</span><span class="s-val" id="valCompleteness">30점</span></div>
                <div class="s-ctrl">
                    <button class="btn-pm" onclick="adj('completeness', -1)">-</button>
                    <input type="range" id="scoreCompleteness" min="0" max="40" value="30" oninput="ui('completeness')">
                    <button class="btn-pm" onclick="adj('completeness', 1)">+</button>
                </div>
            </div>

            <div class="s-group">
                <div class="s-head"><span>👥 관객 호응도 (30점)</span><span class="s-val" id="valReaction">20점</span></div>
                <div class="s-ctrl">
                    <button class="btn-pm" onclick="adj('reaction', -1)">-</button>
                    <input type="range" id="scoreReaction" min="0" max="30" value="20" oninput="ui('reaction')">
                    <button class="btn-pm" onclick="adj('reaction', 1)">+</button>
                </div>
            </div>

            <div class="s-group">
                <div class="s-head"><span>🥑 무대 매너 (20점)</span><span class="s-val" id="valManner">15점</span></div>
                <div class="s-ctrl">
                    <button class="btn-pm" onclick="adj('manner', -1)">-</button>
                    <input type="range" id="scoreManner" min="0" max="20" value="15" oninput="ui('manner')">
                    <button class="btn-pm" onclick="adj('manner', 1)">+</button>
                </div>
            </div>

            <div class="s-group" style="background:#fffbeb; border-color:#fde68a;">
                <div class="s-head"><span style="color:#d97706;">🪄 가산점 (10점)</span><span class="s-val" id="valBonus" style="color:#d97706;">5점</span></div>
                <div class="s-ctrl">
                    <button class="btn-pm" onclick="adj('bonus', -1)">-</button>
                    <input type="range" id="scoreBonus" min="0" max="10" value="5" oninput="ui('bonus')">
                    <button class="btn-pm" onclick="adj('bonus', 1)">+</button>
                </div>
            </div>

            <button class="btn-main" onclick="saveScore()">현재 팀 점수 저장</button>
            <button class="btn-sub-reset" onclick="resetTeam()">🔄 이 팀 점수 초기화</button>
        </div>

        <!-- STEP 4 -->
        <div class="card">
            <div class="title"><span>🏆 실시간 전체 순위 (1~10위)</span></div>
            <table>
                <thead>
                    <tr><th>순위</th><th>팀명</th><th>장르</th><th>총점</th><th>제외점수</th></tr>
                </thead>
                <tbody id="rankBody"></tbody>
            </table>
            <button class="btn-csv" onclick="downCSV()">📊 전체 집계 CSV 다운로드</button>
            <button class="btn-total-reset" onclick="resetAll()">🗑️ 데이터 전체 초기화</button>
        </div>
    </div>

    <!-- 관리자 모달 -->
    <div class="modal" id="adminModal">
        <div class="modal-body">
            <div class="title"><span>🔐 관리자 모드</span> <button class="j-btn" onclick="closeAdmin()">닫기</button></div>
            <table id="adminTable"></table>
            <button class="btn-total-reset" style="margin-top:14px;" onclick="resetAll()">전체 데이터 강제 초기화</button>
        </div>
    </div>

            { id: 5, name: "[7반] 댄스", genre: "댄스", title: "티아라-뽀삐뽀삐 외" },
